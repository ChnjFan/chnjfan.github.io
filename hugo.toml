baseURL = "https://ChnjFan.github.io/"
title = "ByteMemo"
theme = "hugo-coder-nx"
languageCode = "en"
defaultContentLanguage = "en"
enableEmoji = true

[pagination]
pagerSize = 20

[services]
[services.disqus]
# Enable Disqus comments
# shortname = "yourdiscussshortname"

[markup]
[markup.highlight]
style = "onedark"
noClasses = true

[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[params]
author = "ChnjFan"
logo = "images/logo.png"
logo_dark = "images/logo-darkmode.png"
# license = '<a rel="license" href="http://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA-4.0</a>'
description = "ChnjFan's personal website"
keywords = "blog,developer,personal,C++,network"
info = ["C/C++ Developer"]
avatarURL = "images/avatar.JPG"
favicon_32 = "images/favicon.png"
dateFormat = "January 2, 2006"
since = 2026
# Git Commit in Footer, uncomment the line below to enable it
commit = "https://github.com/ChnjFan/chnjfan.github.io/tree/"
# Right To Left, shift content direction for languages such as Arabic
rtl = false
# Specify light/dark colorscheme
# Supported values:
# "auto" (use preference set by browser)
# "dark" (dark background, light foreground)
# "light" (light background, dark foreground) (default)
colorScheme = "auto"
# Hide the toggle button, along with the associated vertical divider
hideColorSchemeToggle = false
# Series see also post count
maxSeeAlsoItems = 10
# Custom CSS
customCSS = []
# Custom SCSS, file path is relative to Hugo's asset folder (default: {your project root}/assets)
customSCSS = []

# Custom JS
customJS = []

# Custom remote JS files
customRemoteJS = []

# If you want to use Google Tag Manager(https://analytics.google.com/) for analytics, add this section
[params.googleTagManager]
id = "G-X66YJ8REQE"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
    
[taxonomies]
category = "categories"
series = "series"
tag = "tags"
author = "authors"

[params.giscus] # https://giscus.app
  repo = "ChnjFan/chnjfan.github.io"
  repoID = "R_kgDOTMltxw"
  category = "Announcements"
  categoryID = "DIC_kwDOTMltx84DCbTy"
  mapping = "pathname"
  term = "0"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "preferred_color_scheme"
  lang = "zh-CN"
  loading = ""

[[params.social]]
name = "Github"
icon = "fa-brands fa-github fa-2x"
weight = 1
url = "https://github.com/ChnjFan/"

